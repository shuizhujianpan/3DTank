name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show tool versions
        run: |
          node --version
          python3 --version
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check vendor/three.module.js
          node --check vendor/three.core.js
      - name: Check local resources and HTTP loading
        run: python3 scripts/check-static-site.py
